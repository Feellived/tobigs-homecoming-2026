<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOBIG'S Homecoming Live</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1230">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1230;--accent:#3d5afe;--peri:#9db0ff;--bg:#f4f5fa;--card:#ffffff;--text:#0f1215;--muted:#6b6f7b;--line:#e3e6f0;--soft:#eef1fb;--ok:#1f9d55;--warn:#d97706;--danger:#d14343;--display:'Space Grotesk',sans-serif;--sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0b1230;--card:#141b3d;--text:#f3f4fa;--muted:#9aa1bf;--line:#26305c;--soft:#1b2450}}
body.screen{--bg:#0b1230;--card:#121a3c;--text:#ffffff;--muted:#9db0ff;--line:#26305c;--soft:#1b2450}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--navy);color:#fff}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.top img{height:16px;width:auto}
.top .live{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--peri)}
.top .who{font-size:12px;color:#c6cde6}
main{max-width:600px;margin:0 auto;padding:12px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px}
h2{font-size:18px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
.now .step{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.now .next{font-size:13px;color:var(--muted);margin-top:4px}
.now .timer{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:8px}
.now .timer.over{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;line-height:1.2}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:72px;resize:vertical}
.q{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .t{font-size:15px;line-height:1.45;word-break:keep-all}
.q .meta{font-size:12px;color:var(--muted);margin-top:4px}
.q .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:6px}
.q.answered .t{color:var(--muted);text-decoration:line-through}
.vote{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0;min-width:48px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}
.vote b{font-family:var(--display);font-size:16px;line-height:1}
.vote small{font-size:10px;color:var(--muted)}
.vote.on{border-color:var(--accent);background:var(--accent);color:#fff}
.vote.on small{color:#e3e8ff}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;margin:6px 0;font-size:15px}
.opt:hover{border-color:var(--accent)}
.res{margin:8px 0}
.res .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.res .bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.res .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.ok{background:#e4f6ec;color:#1f7a44}
.pill.on{background:var(--accent);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
.draw-list{list-style:none;margin:0;padding:0}
.draw-list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.draw-list li:first-child{border-top:0}
.draw-list .rk{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);min-width:44px}
.draw-list .nm{font-weight:700;font-size:16px}
.draw-list .pz{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:8px 0 4px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .grow{min-width:0}
.ok{color:var(--ok)}.warn{color:var(--warn)}.danger{color:var(--danger)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t th{color:var(--muted);font-weight:600}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,96px);letter-spacing:-.03em;line-height:1}
/* screen view */
body.screen main{max-width:none;padding:0;height:100vh;display:grid;grid-template-rows:auto 1fr;}
.sc-head{display:flex;align-items:center;justify-content:space-between;padding:24px 40px;border-bottom:1px solid var(--line)}
.sc-head .brand img{height:22px}
.sc-head .step{font-size:34px;font-weight:800;letter-spacing:-.01em}
.sc-head .next{font-size:16px;color:var(--muted)}
.sc-head .timer{font-family:var(--display);font-size:72px;font-weight:700;line-height:1;letter-spacing:-.03em}
.sc-head .timer.over{color:#ffb86b}
.sc-head .qr{display:flex;align-items:center;gap:14px}
.sc-head .qr img{height:120px;width:120px;border-radius:10px;background:#fff;padding:6px}
.sc-head .qr .u{font-family:var(--display);font-weight:700;font-size:18px;color:var(--peri)}
.sc-body{display:grid;grid-template-columns:3fr 2fr;gap:0;min-height:0}
.sc-col{padding:28px 40px;overflow:hidden;min-height:0}
.sc-col+.sc-col{border-left:1px solid var(--line)}
.sc-col h3{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--peri);margin:0 0 16px;text-transform:uppercase}
.sc-q{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);font-size:26px;line-height:1.35;word-break:keep-all}
.sc-q:first-child{border-top:0}
.sc-q .v{flex:0 0 auto;font-family:var(--display);font-weight:700;font-size:26px;color:var(--peri);min-width:64px}
.sc-q .m{font-size:15px;color:var(--muted);margin-top:4px}
.sc-q.answered{opacity:.4}
.sc-res .l{font-size:22px}
.sc-res .bar{height:18px}
.sc-res .bar i{background:var(--peri)}
.sc-draw li{padding:14px 0;border-top:1px solid var(--line)}
.sc-draw .rk{font-size:26px;min-width:64px}
.sc-draw .nm{font-size:30px}
.sc-draw .pz{font-size:16px}
.sc-empty{color:var(--muted);font-size:20px}
@media(max-width:900px){body.screen main{height:auto}.sc-body{grid-template-columns:1fr}.sc-col+.sc-col{border-left:0;border-top:1px solid var(--line)}.sc-head{flex-wrap:wrap;gap:16px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../"><img src="../assets/wordmark-light.png" alt="TOBIG'S"><span class="live">HOMECOMING LIVE</span></a>
  <span class="who" id="who"></span>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, serverTimestamp, arrayUnion, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

// ---------------- config ----------------
const firebaseConfig = {
  apiKey: "AIzaSyBKDlddQRA1mLotV2V2R-39GhwTrSQ8zVE",
  authDomain: "tobigshoco.firebaseapp.com",
  projectId: "tobigshoco",
  storageBucket: "tobigshoco.firebasestorage.app",
  messagingSenderId: "973817861716",
  appId: "1:973817861716:web:48c2fdd252eab5edf83fc1"
};
const ADMIN_EMAIL = "tobigs2026hoco@gmail.com";
const CONTACT_URL = "https://open.kakao.com/o/sW8KJKQi";
const STEPS = [
  { t:'12:30', n:'입장 · 체크인', d:30 },
  { t:'13:00', n:'Opening · Yesterday', d:10 },
  { t:'13:10', n:'개회사', d:10 },
  { t:'13:20', n:'Today', d:10 },
  { t:'13:30', n:'Alumni Session', d:40 },
  { t:'14:10', n:'Break 1', d:30 },
  { t:'14:40', n:"TOBIG'S Quiz", d:20 },
  { t:'15:00', n:'Table Talk 1', d:25 },
  { t:'15:25', n:'테이블 이동 · 2라운드 테이블로', d:5 },
  { t:'15:30', n:'Table Talk 2', d:30 },
  { t:'16:00', n:'Break 2', d:15 },
  { t:'16:15', n:'Lucky Draw · Closing', d:15 },
  { t:'16:30', n:'단체사진', d:10 },
  { t:'16:40', n:'행사 종료 · 17:30 뒤풀이', d:0 },
];
const DEFAULT_PRIZES = ['1등 · 로지텍 무선 마우스', '2등 · 로지텍 무선 키보드', '3등 · 로지텍 무선 마우스', '4등 · 무드등', '5등 · 무드등'];
const GENS = Array.from({length:26},(_,i)=>(i+1)+'기');

// ---------------- setup ----------------
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toastEl = $('#toast'); let toastT;
const say = m => { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>toastEl.classList.remove('show'), 2200); };
const cid = (() => { try { let v = localStorage.getItem('hc_cid'); if(!v){ v = crypto.randomUUID(); localStorage.setItem('hc_cid', v); } return v; } catch(e){ return 'anon-' + Math.random().toString(36).slice(2); } })();
const rand = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; };
const params = new URLSearchParams(location.search);
const view = params.has('screen') ? 'screen' : params.has('admin') ? 'admin' : 'guest';
const appEl = $('#app');

// ---------------- shared state ----------------
const S = { program:null, questions:[], polls:[], pollVotes:{}, draw:null, tables:null, checkins:{} };
const pollVoteUnsubs = {};
function listenProgram(){ onSnapshot(doc(db,'state','program'), s => { S.program = s.exists() ? s.data() : null; render.program(); }); }
function listenQuestions(){ onSnapshot(collection(db,'questions'), s => { S.questions = s.docs.map(d => ({ id:d.id, ...d.data() })); render.questions(); }); }
function listenPolls(){ onSnapshot(collection(db,'polls'), s => {
  S.polls = s.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  for(const p of S.polls){ if(!pollVoteUnsubs[p.id]){ pollVoteUnsubs[p.id] = onSnapshot(collection(db,'polls',p.id,'votes'), vs => { S.pollVotes[p.id] = vs.docs.map(v=>v.data().option); render.polls(); }); } }
  render.polls();
}); }
function listenDraw(){ onSnapshot(doc(db,'draw','results'), s => { S.draw = s.exists() ? s.data() : null; render.draw(); }); }
function listenCheckins(){ onSnapshot(collection(db,'checkins'), s => { S.checkins = {}; s.docs.forEach(d => S.checkins[d.id] = d.data()); render.checkins(); }); }
async function loadTables(){ try { const r = await fetch('tables.json', {cache:'no-store'}); S.tables = await r.json(); } catch(e){ S.tables = { published:false, rows:[] }; } }
const render = { program(){}, questions(){}, polls(){}, draw(){}, checkins(){} };

function programInfo(){
  const p = S.program;
  if(!p || typeof p.step !== 'number') return { step:null, name:'11월 21일(토) 12:30 입장 · 13:00 개회', next:'행사 당일 이 화면에 진행 순서가 표시됩니다', remain:null };
  const st = STEPS[p.step] || STEPS[STEPS.length-1];
  const nx = STEPS[p.step+1];
  const remain = p.endsAt ? p.endsAt.toMillis() - Date.now() : null;
  return { step:p.step, name:st.n, next: nx ? `다음 · ${nx.t} ${nx.n}` : '', remain };
}
function fmtRemain(ms){ if(ms===null) return ''; const neg = ms<0; ms = Math.abs(ms); const m = Math.floor(ms/60000), s = Math.floor(ms%60000/1000); return (neg?'+':'') + m + ':' + String(s).padStart(2,'0'); }
function pollCounts(p){ const votes = S.pollVotes[p.id] || []; const c = p.options.map(()=>0); votes.forEach(o => { if(c[o]!==undefined) c[o]++; }); return { c, total: votes.length }; }
function visibleQuestions(){ return S.questions.filter(q=>!q.hidden).sort((a,b)=> (b.voters?.length||0)-(a.voters?.length||0) || (b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)); }
function normName(s){ return String(s||'').replace(/\s+/g,'').toLowerCase(); }

// ================= GUEST =================
function guestView(){
  $('#who').textContent = '';
  appEl.innerHTML = `
  <section class="card now">
    <div class="eyebrow">Now</div>
    <div class="step" id="g-step"></div>
    <div class="next" id="g-next"></div>
    <div class="timer" id="g-timer"></div>
  </section>
  <section class="card" id="g-poll" hidden></section>
  <section class="card">
    <div class="eyebrow">Alumni Session</div>
    <h2>선배님께 묻고 싶은 것</h2>
    <p class="muted">질문을 올리면 바로 목록에 뜹니다. 다른 분 질문에 공감을 누르면 공감 많은 순서로 Q&amp;A에 올라갑니다. 이름은 안 적어도 됩니다.</p>
    <form id="g-form">
      <div class="row">
        <select id="g-gen" required style="flex:0 0 100px"><option value="">기수</option>${GENS.map(g=>`<option>${g}</option>`).join('')}</select>
        <input class="grow" type="text" id="g-name" maxlength="20" placeholder="이름 (선택)">
      </div>
      <div class="field"><textarea id="g-text" maxlength="200" placeholder="예) 투빅스 끝나고 첫 직장은 어떻게 구하셨나요?" required></textarea></div>
      <div class="row"><button class="btn btn-primary grow" type="submit" id="g-submit">질문 올리기</button></div>
    </form>
    <div id="g-list" style="margin-top:12px"></div>
  </section>
  <section class="card">
    <div class="eyebrow">My Table</div>
    <h2>내 테이블 찾기</h2>
    <div id="g-table"></div>
  </section>
  <section class="card" id="g-draw" hidden></section>
  <p class="foot">문의는 <a href="${CONTACT_URL}" target="_blank" rel="noopener">운영부 오픈채팅</a> · <a href="../">초대장으로</a></p>`;

  render.program = () => {
    const i = programInfo();
    $('#g-step').textContent = i.name; $('#g-next').textContent = i.next;
    const t = $('#g-timer'); t.textContent = i.remain===null ? '' : fmtRemain(i.remain); t.classList.toggle('over', i.remain!==null && i.remain<0);
  };
  setInterval(render.program, 1000);

  render.questions = () => {
    const list = visibleQuestions();
    $('#g-list').innerHTML = list.length ? list.map(q => {
      const n = q.voters?.length||0, on = q.voters?.includes(cid);
      return `<div class="q${q.answered?' answered':''}"><div class="grow"><div class="t">${esc(q.text)}</div><div class="meta">${esc(q.gen||'')}${q.name?' · '+esc(q.name):''}${q.answered?'<span class="tag">답변 완료</span>':''}</div></div><button class="vote${on?' on':''}" data-id="${q.id}" ${on||q.answered?'disabled':''}><b>${n}</b><small>${on?'공감함':'공감'}</small></button></div>`;
    }).join('') : '<p class="muted">아직 질문이 없습니다. 첫 질문을 올려주세요.</p>';
  };
  $('#g-list').addEventListener('click', async e => {
    const b = e.target.closest('.vote'); if(!b) return;
    b.disabled = true;
    try { await updateDoc(doc(db,'questions',b.dataset.id), { voters: arrayUnion(cid) }); } catch(err){ say('공감을 보내지 못했습니다. 다시 시도해 주세요'); b.disabled = false; }
  });
  $('#g-form').addEventListener('submit', async e => {
    e.preventDefault();
    const gen = $('#g-gen').value, text = $('#g-text').value.trim(), name = $('#g-name').value.trim();
    if(!gen || !text) return;
    const btn = $('#g-submit'); btn.disabled = true;
    try {
      await addDoc(collection(db,'questions'), { gen, text, name, voters:[], createdAt: serverTimestamp(), hidden:false, answered:false, client: cid });
      $('#g-text').value = ''; say('질문을 올렸습니다');
      setTimeout(()=>btn.disabled=false, 8000);
    } catch(err){ say('올리지 못했습니다. 인터넷 연결을 확인해 주세요'); btn.disabled = false; }
  });

  render.polls = () => {
    const open = S.polls.find(p => p.open);
    const box = $('#g-poll');
    if(!open){ box.hidden = true; return; }
    box.hidden = false;
    let voted = null; try { voted = localStorage.getItem('hc_vote_'+open.id); } catch(e){}
    if(voted === null){
      box.innerHTML = `<div class="eyebrow">Live Poll</div><h2>${esc(open.q)}</h2>` + open.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('') + `<p class="muted">하나만 고를 수 있습니다.</p>`;
    } else {
      const { c, total } = pollCounts(open);
      box.innerHTML = `<div class="eyebrow">Live Poll</div><h2>${esc(open.q)}</h2>` + open.options.map((o,i)=>`<div class="res"><div class="l"><span>${esc(o)}${String(i)===voted?' <span class="pill on">내 선택</span>':''}</span><b>${c[i]}</b></div><div class="bar"><i style="width:${total?Math.round(c[i]/total*100):0}%"></i></div></div>`).join('') + `<p class="muted">${total}명 참여</p>`;
    }
  };
  $('#g-poll').addEventListener('click', async e => {
    const b = e.target.closest('.opt'); if(!b) return;
    const open = S.polls.find(p => p.open); if(!open) return;
    const i = Number(b.dataset.i);
    try { await setDoc(doc(db,'polls',open.id,'votes',cid), { option:i, at: serverTimestamp() }); } catch(err){ /* already voted or offline */ }
    try { localStorage.setItem('hc_vote_'+open.id, String(i)); } catch(e){}
    render.polls();
  });

  render.draw = () => {
    const box = $('#g-draw'); const items = S.draw?.items || [];
    if(!items.length){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<div class="eyebrow">Lucky Draw</div><h2>당첨자</h2><ul class="draw-list">` + items.slice().sort((a,b)=>a.rank-b.rank).map(w=>`<li><span class="rk">${w.rank}등</span><div><div class="nm">${esc(w.name)} <span class="muted">${esc(w.gen||'')} · No.${esc(w.no)}</span></div><div class="pz">${esc(w.prize||'')}</div></div></li>`).join('') + `</ul>`;

    box.innerHTML = `<form id="g-tform"><div class="row"><select id="g-tgen" required style="flex:0 0 100px"><option value="">기수</option>${GENS.map(g=>`<option>${g}</option>`).join('')}</select><input class="grow" type="text" id="g-tname" placeholder="이름" required><button class="btn btn-primary" type="submit">찾기</button></div></form><div id="g-tres" style="margin-top:10px"></div>`;

    });
  });

  listenProgram(); listenQuestions(); listenPolls(); listenDraw();
}

    if(b.dataset.a==='open'){ if(!p.open){ for(const o of S.polls){ if(o.open && o.id!==p.id) await updateDoc(doc(db,'polls',o.id),{open:false}); } await updateDoc(ref,{open:true, show:true}); } else await updateDoc(ref,{open:false}); }

  };

  $('#a-cilist').addEventListener('change', async e => { const cb = e.target; if(cb.type!=='checkbox') return; const no = String(cb.dataset.no); const r = ciRows().find(x=>String(x.no)===no) || S.checkins[no]; if(cb.checked) await setDoc(doc(db,'checkins',no), { no:Number(no), name:r?.name||'', gen:r?.gen||'', at: serverTimestamp() }); else await deleteDoc(doc(db,'checkins',no)); });

  // ---- 추첨 ----
  let pool = [], winners = [], prizes = DEFAULT_PRIZES.slice();
  $('#a-draw').innerHTML = `<section class="card"><div class="eyebrow">Prizes</div><textarea id="a-prizes">${esc(prizes.join('\n'))}</textarea><p class="muted">1등부터 한 줄씩. 추첨은 5등부터 합니다.</p></section>
    <section class="card"><div class="eyebrow">Pool</div>
      <div class="row"><label><input type="radio" name="a-src" value="ci" checked> 체크인 완료자</label><label><input type="radio" name="a-src" value="all"> 전체 명단</label></div>

      <div class="field"><label>회고 사진 제공 · 명찰 번호 (쉼표)</label><input type="text" id="a-xpic" placeholder="예) 5, 8"></div>
      <div class="row"><button class="btn btn-primary" id="a-build">응모권 계산</button><button class="btn" id="a-sim">1만 회 시뮬레이션</button></div>
      <div id="a-pool" style="margin-top:10px"></div></section>
    <section class="card"><div class="eyebrow">Draw</div>
      <div class="row" id="a-rank">${[5,4,3,2,1].map(r=>`<button class="btn" data-r="${r}">${r}등 추첨</button>`).join('')}</div>
      <div id="a-result" style="margin:16px 0"></div>
      <div class="row"><button class="btn" id="a-redo">현재 등급 재추첨</button><button class="btn danger" id="a-reset">결과 초기화</button></div>
      <ul class="draw-list" id="a-winners" style="margin-top:12px"></ul></section>`;
  const parseNos = s => String(s||'').split(/[,\s]+/).map(x=>x.trim()).filter(Boolean);
  const buildPool = () => {
    prizes = $('#a-prizes').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const src = document.querySelector('input[name=a-src]:checked').value;
    const rows = ciRows();
    let base = src==='ci' ? Object.values(S.checkins).map(c=>({ no:String(c.no), name:c.name, gen:c.gen })) : rows.map(r=>({ no:String(r.no), name:r.name, gen:r.gen }));
    base = base.map(p => { const r = rows.find(x=>String(x.no)===p.no); return { ...p, name:p.name||r?.name||'', gen:p.gen||r?.gen||'', t1:r?.t1 }; });
    const quizT = parseNos($('#a-xquiz').value), stk = new Set(parseNos($('#a-xstk').value)), pic = new Set(parseNos($('#a-xpic').value));

    return pool;
  };

  const saveWinners = async () => { try { await setDoc(doc(db,'draw','results'), { items: winners, updatedAt: serverTimestamp() }); } catch(e){ say('결과를 서버에 올리지 못했습니다 (오프라인). 화면에는 로컬로 표시됩니다'); } renderWinners(); };
  const renderWinners = () => { $('#a-winners').innerHTML = winners.slice().sort((a,b)=>b.rank-a.rank).map(w=>`<li><span class="rk">${w.rank}등</span><div><div class="nm">${esc(w.name)} <span class="muted">${esc(w.gen)} · No.${w.no}</span></div><div class="pz">${esc(w.prize)}</div></div></li>`).join(''); };
  $('#a-build').onclick = buildPool;
  $('#a-rank').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return; const rank = Number(b.dataset.r);
    if(!pool.length) buildPool(); if(!pool.length){ say('응모 풀이 비어 있습니다'); return; }
    if(winners.some(w=>w.rank===rank)){ say(rank+'등은 이미 추첨했습니다. 재추첨을 쓰세요'); return; }
    const w = drawOne(new Set(winners.map(x=>x.no))); if(!w){ say('남은 응모자가 없습니다'); return; }
    winners.push({ rank, no:w.no, name:w.name, gen:w.gen, prize: prizes[rank-1]||'' });
    $('#a-result').innerHTML = `<div class="muted">${rank}등 · ${esc(prizes[rank-1]||'')}</div><div class="big">${esc(w.name)}</div><div class="muted">${esc(w.gen)} · 명찰 번호 ${w.no}</div>`;
    saveWinners();
  });
  $('#a-redo').onclick = () => { if(!winners.length) return; const last = winners[winners.length-1]; if(!confirm(`${last.rank}등 ${last.name} 취소하고 다시 뽑을까요? (번호는 풀에 남습니다)`)) return; winners.pop(); const w = drawOne(new Set(winners.map(x=>x.no))); if(!w) return; winners.push({ rank:last.rank, no:w.no, name:w.name, gen:w.gen, prize: prizes[last.rank-1]||'' }); $('#a-result').innerHTML = `<div class="muted">${last.rank}등 · 재추첨</div><div class="big">${esc(w.name)}</div><div class="muted">${esc(w.gen)} · 명찰 번호 ${w.no}</div>`; saveWinners(); };
  $('#a-reset').onclick = () => { if(!confirm('당첨 결과를 모두 지울까요?')) return; winners = []; $('#a-result').innerHTML=''; saveWinners(); };
  $('#a-sim').onclick = () => {
    if(!pool.length) buildPool(); if(pool.length<6){ say('시뮬레이션은 6명 이상 필요합니다'); return; }
    const N = 10000, wins = {}; pool.forEach(p=>wins[p.no]=0);
    for(let i=0;i<N;i++){ const ex = new Set(); for(let r=5;r>=1;r--){ const w = drawOne(ex); if(!w) break; ex.add(w.no); wins[w.no]++; } }
    const total = pool.reduce((s,p)=>s+p.tickets,0);
    const rows = pool.slice().sort((a,b)=>b.tickets-a.tickets).slice(0,12).map(p=>`<tr><td>${p.no}</td><td>${esc(p.name)}</td><td>${p.tickets}</td><td>${(p.tickets/total*5*100).toFixed(1)}%</td><td>${(wins[p.no]/N*100).toFixed(1)}%</td></tr>`).join('');
    $('#a-pool').insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:10px">1만 회 시뮬레이션 (5등→1등, 1인 1회). 기대 당첨률은 응모권 비율 × 5의 근사치</p><table class="t"><tr><th>번호</th><th>이름</th><th>응모권</th><th>기대</th><th>관측</th></tr>${rows}</table>`);
  };
  render.draw = () => { if(S.draw?.items && !winners.length){ winners = S.draw.items.slice(); renderWinners(); } };

  loadTables().then(render.checkins);
  listenProgram(); listenQuestions(); listenPolls(); listenCheckins(); listenDraw();
}

if(view==='screen') screenView(); else if(view==='admin') adminView(); else guestView();
</script>
