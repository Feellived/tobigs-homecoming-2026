<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOBIG'S Homecoming Live</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1230;--accent:#3d5afe;--peri:#9db0ff;--text:#ffffff;--muted:#9aa3c7;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--field:rgba(255,255,255,.08);--display:'Space Grotesk',sans-serif;--sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--text);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--peri)}
.top{max-width:560px;margin:0 auto;padding:28px 16px 8px}
.top .slogan{display:block;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1;color:#fff;text-decoration:none}
.top .slogan b{color:var(--peri);font-weight:700}
.top .brand{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--peri);margin-top:8px}
main{max-width:560px;margin:0 auto;padding:8px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.card.primary{border-color:var(--peri);background:rgba(61,90,254,.18)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--peri);margin-bottom:8px}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}
p{margin:6px 0}
.muted{color:var(--muted);font-size:13px}
.step{font-size:24px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.timer{font-family:var(--display);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;margin-top:8px;letter-spacing:-.02em}
.timer.over{color:#ffb86b}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:transparent;color:#fff;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--accent);border-color:var(--accent)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:#fff;outline:none;margin:4px 0}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.4)}
input:focus,textarea:focus,select:focus{border-color:var(--peri)}
select option{color:#0b1230}
textarea{min-height:68px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.back{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;margin:4px 0 0}
.entry{display:block;text-decoration:none;color:#fff}
.entry h2{margin-bottom:4px}
.q{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .t{font-size:15px;line-height:1.45;word-break:keep-all}
.q .m{font-size:12px;color:var(--muted);margin-top:2px}
.q.done .t{color:var(--muted);text-decoration:line-through}
.vote{flex:0 0 auto;min-width:52px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#fff;font-weight:700;font-size:14px}
.vote.on{background:var(--accent);border-color:var(--accent)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:#fff;margin:6px 0;font-size:15px}
.res{margin:8px 0}
.res .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.res .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.res .bar i{display:block;height:100%;background:var(--peri)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:8px 0}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px}
.tabs button.on{background:#fff;border-color:#fff;color:var(--navy)}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.win{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.win:first-child{border-top:0}
.win .rk{font-family:var(--display);font-weight:700;color:var(--peri);min-width:44px}
.win.new{animation:pop 1.2s ease}
@keyframes pop{from{background:rgba(157,176,255,.3)}to{background:transparent}}
.big{font-family:var(--display);font-size:48px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--navy);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
/* screen */
body.screen .top{display:none}
body.screen main{max-width:none;padding:0;height:100vh;display:grid;grid-template-rows:auto 1fr}
.sh{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 40px;border-bottom:1px solid var(--line)}
.sh .step{font-size:34px}
.sh .next{font-size:16px;color:var(--peri)}
.sh .timer{font-size:72px;margin:0}
.sh .qr{display:flex;align-items:center;gap:14px}
.sh .qr img{width:120px;height:120px;border-radius:8px;background:#fff;padding:6px}
.sh .qr div{font-family:var(--display);font-size:18px;font-weight:700;color:var(--peri)}
.sb{display:grid;grid-template-columns:3fr 2fr;min-height:0}
.sc{padding:28px 40px;overflow:hidden}
.sc+.sc{border-left:1px solid var(--line)}
.sc h3{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--peri);margin:0 0 16px}
.sq{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--line);font-size:26px;line-height:1.35;word-break:keep-all}
.sq:first-child{border-top:0}
.sq .v{flex:0 0 auto;min-width:64px;font-family:var(--display);font-weight:700;color:var(--peri)}
.sq .m{font-size:15px;color:var(--peri);margin-top:4px}
.sq.done{opacity:.4}
.sc .res .l{font-size:22px}
.sc .res .bar{height:18px}
.sc .win{padding:14px 0}
.sc .win .rk{font-size:26px;min-width:64px}
.sc .win b{font-size:30px}
.sc .win span{font-size:16px;color:var(--peri)}
.se{color:var(--peri);font-size:20px}
.ov{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5;animation:fade .4s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov .rk{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.2em;color:var(--peri)}
.ov .pz{font-size:22px;color:var(--muted);margin-top:8px}
.ov .roll{font-family:var(--display);font-weight:700;font-size:min(28vw,260px);line-height:1;letter-spacing:-.04em;margin:24px 0;font-variant-numeric:tabular-nums}
.ov .nm{font-size:min(14vw,120px);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin:16px 0 8px}
.ov .meta{font-family:var(--display);font-size:32px;color:var(--peri)}
@media(max-width:900px){body.screen main{height:auto}.sb{grid-template-columns:1fr}.sc+.sc{border-left:0;border-top:1px solid var(--line)}.sh{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><a class="slogan" href="./">Big Then. <b>Bigger Now.</b></a><div class="brand">TOBIG'S HOMECOMING LIVE</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp, arrayUnion, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

const firebaseConfig = { apiKey:"AIzaSyBKDlddQRA1mLotV2V2R-39GhwTrSQ8zVE", authDomain:"tobigshoco.firebaseapp.com", projectId:"tobigshoco", storageBucket:"tobigshoco.firebasestorage.app", messagingSenderId:"973817861716", appId:"1:973817861716:web:48c2fdd252eab5edf83fc1" };
const ADMIN_EMAIL = "tobigs2026hoco@gmail.com";
const STEPS = [
  { t:'12:30', n:'입장 · 체크인', d:30, hi:'qa' }, { t:'13:00', n:'Opening · Yesterday', d:10, hi:'qa' }, { t:'13:10', n:'개회사', d:10, hi:'qa' }, { t:'13:20', n:'Today', d:10, hi:'qa' },
  { t:'13:30', n:'Alumni Session', d:40, hi:'qa' }, { t:'14:10', n:'Break 1', d:30, hi:'table' }, { t:'14:40', n:"TOBIG'S Quiz", d:20, hi:'table' },
  { t:'15:00', n:'Table Talk 1', d:25, hi:'table' }, { t:'15:25', n:'2라운드 테이블로 이동', d:5, hi:'table' }, { t:'15:30', n:'Table Talk 2', d:30, hi:'table' },
  { t:'16:00', n:'Break 2', d:15, hi:'draw' }, { t:'16:15', n:'Lucky Draw · Closing', d:15, hi:'draw' }, { t:'16:30', n:'단체사진', d:10, hi:'draw' }, { t:'16:40', n:'행사 종료 · 17:30 뒤풀이', d:0, hi:'draw' },
];
const PRIZES = ['', '1등', '2등', '3등', '4등', '5등'];
const GENS = Array.from({length:26},(_,i)=>(i+1)+'기');

const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT; const say = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2000); };
const cid = (() => { try { let v = localStorage.getItem('hc_cid'); if(!v){ v = crypto.randomUUID(); localStorage.setItem('hc_cid', v); } return v; } catch(e){ return 'anon-' + Math.random().toString(36).slice(2); } })();
const rand = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; };
const qs = location.search;
const view = qs.includes('screen') ? 'screen' : qs.includes('admin') ? 'admin' : qs.includes('qa') ? 'qa' : qs.includes('draw') ? 'draw' : 'hub';
const appEl = $('#app');

const S = { program:null, questions:[], polls:[], votes:{}, draw:null, tables:{ published:false, rows:[] }, checkins:{} };
const render = { program(){}, questions(){}, polls(){}, draw(){}, checkins(){} };
const voteSubs = {};
const listen = {
  program: () => onSnapshot(doc(db,'state','program'), s => { S.program = s.exists() ? s.data() : null; render.program(); }),
  questions: () => onSnapshot(collection(db,'questions'), s => { S.questions = s.docs.map(d => ({ id:d.id, ...d.data() })); render.questions(); }),
  polls: () => onSnapshot(collection(db,'polls'), s => {
    S.polls = s.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
    S.polls.forEach(p => { if(!voteSubs[p.id]) voteSubs[p.id] = onSnapshot(collection(db,'polls',p.id,'votes'), v => { S.votes[p.id] = v.docs.map(x=>x.data().option); render.polls(); }); });
    render.polls();
  }),
  draw: () => onSnapshot(doc(db,'draw','results'), s => { S.draw = s.exists() ? s.data() : null; render.draw(); }),
  checkins: () => onSnapshot(collection(db,'checkins'), s => { S.checkins = {}; s.docs.forEach(d => S.checkins[d.id] = d.data()); render.checkins(); }),
};
const loadTables = () => fetch('tables.json',{cache:'no-store'}).then(r=>r.json()).then(t => { S.tables = t; }).catch(()=>{});

function info(){
  const p = S.program;
  if(!p || typeof p.step !== 'number') return { step:null, name:"TOBIG'S Homecoming Day 2026", next:'', remain:null, hi:null };
  const st = STEPS[p.step] || STEPS[STEPS.length-1], nx = STEPS[p.step+1];
  return { step:p.step, name:st.n, next: nx ? `다음 ${nx.t} ${nx.n}` : '', remain: p.endsAt ? p.endsAt.toMillis() - Date.now() : null, hi:st.hi };
}
const fmt = ms => { if(ms===null) return ''; const neg = ms<0; ms = Math.abs(ms); return (neg?'+':'') + Math.floor(ms/60000) + ':' + String(Math.floor(ms%60000/1000)).padStart(2,'0'); };
const counts = p => { const v = S.votes[p.id] || [], c = p.options.map(()=>0); v.forEach(o => { if(c[o]!==undefined) c[o]++; }); return { c, total:v.length }; };
const visible = () => S.questions.filter(x=>!x.hidden).sort((a,b)=>(b.voters?.length||0)-(a.voters?.length||0) || (b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
const norm = s => String(s||'').replace(/\s+/g,'').toLowerCase();
const bars = p => p.options.map((o,i)=>{ const { c, total } = counts(p); return `<div class="res"><div class="l"><span>${esc(o)}</span><b>${c[i]}</b></div><div class="bar"><i style="width:${total?Math.round(c[i]/total*100):0}%"></i></div></div>`; }).join('');
const winnersHtml = (items, newNo) => items.slice().sort((a,b)=>a.rank-b.rank).map(w=>`<div class="win${String(w.no)===String(newNo)?' new':''}"><span class="rk">${esc(w.rank)}등</span><div><b>${esc(w.name)}</b> <span class="muted">${esc(w.gen||'')} · ${esc(w.no)}번</span></div></div>`).join('');
const nowCard = id => `<section class="card" id="${id}" hidden><div class="eyebrow">NOW</div><div class="step" id="${id}-step"></div><div class="muted" id="${id}-next"></div><div class="timer" id="${id}-timer"></div></section>`;
let hubHi = () => {};
const bindNow = id => { render.program = () => { const i = info(); $('#'+id).hidden = i.step===null; $('#'+id+'-step').textContent = i.name; $('#'+id+'-next').textContent = i.next; const t = $('#'+id+'-timer'); t.textContent = fmt(i.remain); t.classList.toggle('over', i.remain!==null && i.remain<0); hubHi(i.hi); }; setInterval(render.program, 1000); };

// ---------- 허브 ----------
function hub(){
  appEl.innerHTML = nowCard('h-now') + `
  <a class="card entry" href="?qa" id="e-qa"><div class="eyebrow">ALUMNI SESSION</div><h2>질문 · 투표</h2><p class="muted">좋은 질문에 투표해주세요</p></a>
  <a class="card entry" href="table/" id="e-table"><div class="eyebrow">TABLE TALK</div><h2>내 테이블</h2><p class="muted">1라운드 · 2라운드 테이블 번호</p></a>
  <a class="card entry" href="?draw" id="e-draw"><div class="eyebrow">LUCKY DRAW</div><h2>당첨자</h2></a>`;
  hubHi = hi => ['qa','table','draw'].forEach(k => $('#e-'+k).classList.toggle('primary', k===hi));
  bindNow('h-now'); listen.program();
}

// ---------- 질문 · 투표 ----------
function qa(){
  appEl.innerHTML = `<a class="back" href="./">← Live</a>` + nowCard('q-now') + `
  <section class="card" id="g-poll" hidden></section>
  <section class="card"><div class="eyebrow">ALUMNI SESSION</div><h2>선배님께 묻고 싶은 것</h2>
    <form id="g-form"><div class="row"><select id="g-gen" required style="flex:0 0 96px"><option value="">기수</option>${GENS.map(g=>`<option>${g}</option>`).join('')}</select><button class="btn btn-primary grow" type="submit" id="g-submit">질문 올리기</button></div><textarea id="g-text" maxlength="200" placeholder="질문" required></textarea></form>
    <div id="g-list" style="margin-top:8px"></div></section>`;
  bindNow('q-now');
  render.questions = () => { const l = visible(); $('#g-list').innerHTML = l.map(x => { const n = x.voters?.length||0, on = x.voters?.includes(cid); return `<div class="q${x.answered?' done':''}"><div class="grow"><div class="t">${esc(x.text)}</div><div class="m">${esc(x.gen||'')}${x.answered?' · 답변 완료':''}</div></div><button class="vote${on?' on':''}" data-id="${esc(x.id)}" ${on||x.answered?'disabled':''}>${on?'투표함':'투표'} ${n}</button></div>`; }).join('') || '<p class="muted">아직 질문이 없습니다.</p>'; };
  $('#g-list').addEventListener('click', async e => { const b = e.target.closest('.vote'); if(!b) return; b.disabled = true; try { await updateDoc(doc(db,'questions',b.dataset.id), { voters: arrayUnion(cid) }); } catch(err){ b.disabled = false; say('다시 시도해 주세요'); } });
  $('#g-form').addEventListener('submit', async e => { e.preventDefault(); const gen = $('#g-gen').value, text = $('#g-text').value.trim(); if(!gen||!text) return; const b = $('#g-submit'); b.disabled = true;
    try { await addDoc(collection(db,'questions'), { gen, text, name:'', voters:[], createdAt: serverTimestamp(), hidden:false, answered:false, client:cid }); $('#g-text').value=''; say('올렸습니다'); setTimeout(()=>b.disabled=false, 8000); } catch(err){ say('인터넷 연결을 확인해 주세요'); b.disabled = false; } });
  render.polls = () => { const p = S.polls.find(x=>x.open), box = $('#g-poll'); if(!p){ box.hidden = true; return; } box.hidden = false; let v = null; try { v = localStorage.getItem('hc_vote_'+p.id); } catch(e){}
    box.innerHTML = `<div class="eyebrow">LIVE POLL</div><h2>${esc(p.q)}</h2>` + (v===null ? p.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('') : bars(p) + `<p class="muted">${counts(p).total}명 참여</p>`); };
  $('#g-poll').addEventListener('click', async e => { const b = e.target.closest('.opt'); if(!b) return; const p = S.polls.find(x=>x.open); if(!p) return; try { await setDoc(doc(db,'polls',p.id,'votes',cid), { option:Number(b.dataset.i), at: serverTimestamp() }); } catch(err){} try { localStorage.setItem('hc_vote_'+p.id, b.dataset.i); } catch(e){} render.polls(); });
  listen.program(); listen.questions(); listen.polls();
}

// ---------- 당첨자 ----------
function drawView(){
  appEl.innerHTML = `<a class="back" href="./">← Live</a>` + nowCard('d-now') + `<section class="card"><div class="eyebrow">LUCKY DRAW</div><div id="g-draw"></div></section>`;
  bindNow('d-now');
  render.draw = () => { const items = S.draw?.items||[]; $('#g-draw').innerHTML = items.length ? winnersHtml(items, S.draw?.live?.no) : '<p class="muted">추첨 전</p>'; };
  listen.program(); listen.draw();
}

// ---------- 프로젝터 ----------
function screen(){
  document.body.classList.add('screen');
  appEl.innerHTML = `<div class="sh"><div><div class="step" id="s-step"></div><div class="next" id="s-next"></div></div><div class="timer" id="s-timer"></div><div class="qr"><img src="qr.png" alt=""><div>homecoming.datamarket.ai.kr/live</div></div></div>
  <div class="sb"><div class="sc"><h3>질문</h3><div id="s-q"></div></div><div class="sc" id="s-r"></div></div>`;
  render.program = () => { const i = info(); $('#s-step').textContent = i.name; $('#s-next').textContent = i.next; const t = $('#s-timer'); t.textContent = fmt(i.remain); t.classList.toggle('over', i.remain!==null && i.remain<0); };
  setInterval(render.program, 1000);
  render.questions = () => { $('#s-q').innerHTML = visible().slice(0,8).map(x=>`<div class="sq${x.answered?' done':''}"><div class="v">👍 ${x.voters?.length||0}</div><div><div>${esc(x.text)}</div><div class="m">${esc(x.gen||'')}</div></div></div>`).join('') || '<p class="se">QR로 들어와 질문을 올려주세요.</p>'; };
  const right = () => { const items = S.draw?.items||[], p = S.polls.find(x=>x.open||x.show), box = $('#s-r');
    if(items.length) box.innerHTML = `<h3>Lucky Draw</h3>` + items.slice().sort((a,b)=>b.rank-a.rank).map(w=>`<div class="win"><span class="rk">${esc(w.rank)}등</span><div><b>${esc(w.name)}</b> <span>${esc(w.gen||'')} · ${esc(w.no)}번</span></div></div>`).join('');
    else if(p) box.innerHTML = `<h3>투표${p.open?'':' · 마감'}</h3><div style="font-size:30px;font-weight:800;margin-bottom:18px">${esc(p.q)}</div>` + bars(p) + `<p class="se">${counts(p).total}명 참여</p>`;
    else box.innerHTML = `<h3>Big Then. Bigger Now.</h3>`; };
  // 당첨자 공개 연출: 번호가 3초 돌아간 뒤 멈추고 이름 공개, 7초 뒤 닫힘
  let seenSeq = null;
  const reveal = lv => {
    const ov = document.createElement('div'); ov.className = 'ov';
    const pz = lv.prize && lv.prize !== lv.rank+'등' ? `<div class="pz">${esc(lv.prize)}</div>` : ''; ov.innerHTML = `<div class="rk">${esc(lv.rank)}등</div>${pz}<div class="roll" id="roll">00</div>`;
    document.body.appendChild(ov);
    const maxNo = Math.max(80, ...(S.draw?.items||[]).map(w=>Number(w.no)||0));
    const roll = ov.querySelector('#roll'), t0 = Date.now();
    const iv = setInterval(() => { if(Date.now() - t0 < 3000){ roll.textContent = String(Math.floor(rand()*maxNo)+1).padStart(2,'0'); return; } clearInterval(iv); roll.textContent = String(lv.no).padStart(2,'0'); setTimeout(() => roll.insertAdjacentHTML('afterend', `<div class="nm">${esc(lv.name)}</div><div class="meta">${esc(lv.gen||'')} · No.${esc(lv.no)}</div>`), 600); setTimeout(() => ov.remove(), 7600); }, 60);
  };
  render.polls = right;
  render.draw = () => { right(); const lv = S.draw?.live; const seq = lv?.seq || 0; if(seenSeq===null){ seenSeq = seq; return; } if(seq > seenSeq){ seenSeq = seq; reveal(lv); } };
  listen.program(); listen.questions(); listen.polls(); listen.draw();
}

// ---------- 운영 ----------
function admin(){
  appEl.innerHTML = `<section class="card"><h2>운영 로그인</h2><form id="a-login"><input type="email" id="a-email" value="${ADMIN_EMAIL}" required><input type="password" id="a-pw" placeholder="비밀번호" required><button class="btn btn-primary" type="submit">로그인</button><p class="muted" id="a-err"></p></form></section>`;
  $('#a-login').addEventListener('submit', async e => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, $('#a-email').value.trim(), $('#a-pw').value); } catch(err){ $('#a-err').textContent = '로그인 실패: ' + (err.code||err.message); } });
  onAuthStateChanged(auth, u => { if(u) adminMain(); });
}

function adminMain(){
  appEl.innerHTML = `<div class="tabs" id="a-tabs"><button data-t="prog" class="on">진행</button><button data-t="q">질문</button><button data-t="poll">투표</button><button data-t="ci">체크인</button><button data-t="draw">추첨</button></div>
  <div id="a-prog"></div><div id="a-q" hidden></div><div id="a-poll" hidden></div><div id="a-ci" hidden></div><div id="a-draw" hidden></div>
  <p class="muted"><a href="?screen" target="_blank">프로젝터 화면</a> · <a href="./" target="_blank">참가자 화면</a></p>`;
  $('#a-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; document.querySelectorAll('#a-tabs button').forEach(x=>x.classList.toggle('on', x===b)); ['prog','q','poll','ci','draw'].forEach(t => $('#a-'+t).hidden = t!==b.dataset.t); });

  // 진행
  $('#a-prog').innerHTML = `<section class="card"><div class="step" id="a-step"></div><div class="timer" id="a-timer"></div><div class="row" style="margin-top:10px"><button class="btn btn-primary" id="a-next">다음 순서</button><button class="btn" id="a-plus">+5분</button></div></section>
    <section class="card"><ul class="list" id="a-steps">${STEPS.map((s,i)=>`<li><span class="muted" style="min-width:44px">${s.t}</span><span class="grow">${esc(s.n)}</span><button class="btn btn-sm" data-i="${i}">시작</button></li>`).join('')}</ul></section>`;
  const setStep = async i => { const st = STEPS[i]; if(!st) return; await setDoc(doc(db,'state','program'), { step:i, endsAt: st.d ? Timestamp.fromMillis(Date.now()+st.d*60000) : null }); };
  $('#a-steps').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setStep(Number(b.dataset.i)); });
  $('#a-next').onclick = () => setStep((S.program?.step ?? -1) + 1);
  $('#a-plus').onclick = () => { const e = S.program?.endsAt; if(e) updateDoc(doc(db,'state','program'), { endsAt: Timestamp.fromMillis(e.toMillis()+300000) }); };
  render.program = () => { const i = info(); $('#a-step').textContent = i.name; $('#a-timer').textContent = fmt(i.remain); document.querySelectorAll('#a-steps li').forEach((li,k)=> li.style.fontWeight = k===i.step?'800':'400'); };
  setInterval(render.program, 1000);

  // 질문
  $('#a-q').innerHTML = `<section class="card"><div id="a-ql"></div></section>`;
  render.questions = () => { $('#a-ql').innerHTML = S.questions.slice().sort((a,b)=>(b.voters?.length||0)-(a.voters?.length||0)).map(x=>`<div class="q${x.answered?' done':''}" style="${x.hidden?'opacity:.4':''}"><div class="grow"><div class="t">${esc(x.text)}</div><div class="m">👍 ${x.voters?.length||0} · ${esc(x.gen||'')}${x.hidden?' · 숨김':''}</div><div class="row" style="margin-top:6px"><button class="btn btn-sm" data-a="ans" data-id="${esc(x.id)}">${x.answered?'답변 취소':'답변 완료'}</button><button class="btn btn-sm" data-a="hide" data-id="${esc(x.id)}">${x.hidden?'표시':'숨김'}</button><button class="btn btn-sm" data-a="del" data-id="${esc(x.id)}">삭제</button></div></div></div>`).join('') || '<p class="muted">질문 없음</p>'; };
  $('#a-ql').addEventListener('click', async e => { const b = e.target.closest('button'); if(!b) return; const x = S.questions.find(y=>y.id===b.dataset.id); if(!x) return; const ref = doc(db,'questions',x.id);
    if(b.dataset.a==='ans') await updateDoc(ref,{answered:!x.answered}); if(b.dataset.a==='hide') await updateDoc(ref,{hidden:!x.hidden}); if(b.dataset.a==='del' && confirm('삭제?')) await deleteDoc(ref); });

  // 투표
  $('#a-poll').innerHTML = `<section class="card"><form id="a-pf"><input type="text" id="a-pq" placeholder="질문" required><textarea id="a-po" placeholder="선택지, 한 줄에 하나" required></textarea><button class="btn btn-primary" type="submit">투표 만들기</button></form></section><div id="a-pl"></div>`;
  $('#a-pf').addEventListener('submit', async e => { e.preventDefault(); const qq = $('#a-pq').value.trim(), options = $('#a-po').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!qq||options.length<2) return; await addDoc(collection(db,'polls'), { q:qq, options, open:false, show:false, createdAt: serverTimestamp() }); $('#a-pq').value=''; $('#a-po').value=''; });
  render.polls = () => { $('#a-pl').innerHTML = S.polls.map(p=>`<section class="card"><b>${esc(p.q)}</b> <span class="muted">${p.open?'진행 중':'닫힘'}${p.show?' · 화면 표시':''}</span>${bars(p)}<p class="muted">${counts(p).total}명</p><div class="row"><button class="btn btn-sm btn-primary" data-a="open" data-id="${esc(p.id)}">${p.open?'닫기':'열기'}</button><button class="btn btn-sm" data-a="show" data-id="${esc(p.id)}">${p.show?'화면에서 내리기':'화면에 올리기'}</button><button class="btn btn-sm" data-a="del" data-id="${esc(p.id)}">삭제</button></div></section>`).join(''); };
  $('#a-pl').addEventListener('click', async e => { const b = e.target.closest('button'); if(!b) return; const p = S.polls.find(x=>x.id===b.dataset.id); if(!p) return; const ref = doc(db,'polls',p.id);
    if(b.dataset.a==='open'){ if(!p.open){ for(const o of S.polls) if(o.open && o.id!==p.id) await updateDoc(doc(db,'polls',o.id),{open:false}); await updateDoc(ref,{open:true,show:true}); } else await updateDoc(ref,{open:false}); }
    if(b.dataset.a==='show') await updateDoc(ref,{show:!p.show}); if(b.dataset.a==='del' && confirm('삭제?')) await deleteDoc(ref); });

  // 체크인
  $('#a-ci').innerHTML = `<section class="card"><p class="muted" id="a-cc"></p><input type="text" id="a-cs" placeholder="이름 또는 번호"><div id="a-cl"></div></section>
    <section class="card"><form id="a-ca" class="row"><input type="number" id="a-cno" placeholder="번호" style="flex:0 0 80px" required><input type="text" id="a-cn" placeholder="이름" class="grow" required><select id="a-cg" style="flex:0 0 90px">${GENS.map(g=>`<option>${g}</option>`).join('')}</select><button class="btn btn-sm btn-primary" type="submit">체크인</button></form></section>`;
  const rows = () => S.tables.rows || [];
  render.checkins = () => { const k = norm($('#a-cs').value); const extra = Object.values(S.checkins).filter(c => !rows().some(r=>String(r.no)===String(c.no)));
    $('#a-cc').textContent = `체크인 ${Object.keys(S.checkins).length} / 명단 ${rows().length}`;
    $('#a-cl').innerHTML = rows().filter(r=>!k || norm(r.name).includes(k) || String(r.no)===k).map(r=>`<label class="row" style="padding:8px 0;border-top:1px solid var(--line)"><input type="checkbox" data-no="${esc(r.no)}" ${S.checkins[String(r.no)]?'checked':''}><span class="muted" style="min-width:36px">${esc(r.no)}</span><b>${esc(r.name)}</b><span class="muted">${esc(r.gen)} · ${esc(r.t1)}/${esc(r.t2)}</span></label>`).join('')
      + extra.map(c=>`<label class="row" style="padding:8px 0;border-top:1px solid var(--line)"><input type="checkbox" data-no="${esc(c.no)}" checked><span class="muted" style="min-width:36px">${esc(c.no)}</span><b>${esc(c.name)}</b><span class="muted">${esc(c.gen)}</span></label>`).join(''); };
  $('#a-cs').addEventListener('input', render.checkins);
  $('#a-cl').addEventListener('change', async e => { const cb = e.target; if(cb.type!=='checkbox') return; const no = String(cb.dataset.no), r = rows().find(x=>String(x.no)===no) || S.checkins[no]; if(cb.checked) await setDoc(doc(db,'checkins',no), { no:Number(no), name:r?.name||'', gen:r?.gen||'', at: serverTimestamp() }); else await deleteDoc(doc(db,'checkins',no)); });
  $('#a-ca').addEventListener('submit', async e => { e.preventDefault(); const no = String($('#a-cno').value); await setDoc(doc(db,'checkins',no), { no:Number(no), name:$('#a-cn').value.trim(), gen:$('#a-cg').value, at: serverTimestamp() }); $('#a-cno').value=''; $('#a-cn').value=''; });

  // 추첨
  let pool = [], winners = [], seq = 0;
  $('#a-draw').innerHTML = `<section class="card"><div class="row"><label><input type="radio" name="src" value="ci" checked> 체크인 완료자</label><label><input type="radio" name="src" value="all"> 전체 명단</label></div>
    <label class="f">퀴즈 우승 테이블 (1라운드 번호)</label><input type="text" id="a-xq"><label class="f">스티커 5개 이상 · 명찰 번호 (쉼표)</label><input type="text" id="a-xs"><label class="f">사진 제공 · 명찰 번호 (쉼표)</label><input type="text" id="a-xp">
    <button class="btn" id="a-build">응모권 계산</button><div id="a-pool" style="margin-top:8px"></div></section>
    <section class="card"><div class="row">${[5,4,3,2,1].map(r=>`<button class="btn" data-r="${r}">${r}등</button>`).join('')}</div><div id="a-res" style="margin:14px 0"></div><div class="row"><button class="btn btn-sm" id="a-redo">다시 뽑기</button><button class="btn btn-sm" id="a-reset">초기화</button></div><div id="a-w" style="margin-top:10px"></div></section>`;
  const nos = s => String(s||'').split(/[,\s]+/).filter(Boolean);
  const build = () => { const src = document.querySelector('input[name=src]:checked').value, rs = rows();
    const base = (src==='ci' ? Object.values(S.checkins).map(c=>({ no:String(c.no), name:c.name, gen:c.gen })) : rs.map(r=>({ no:String(r.no), name:r.name, gen:r.gen }))).map(p => { const r = rs.find(x=>String(x.no)===p.no); return { ...p, name:p.name||r?.name||'', gen:p.gen||r?.gen||'', t1:r?.t1 }; });
    const qt = nos($('#a-xq').value), st = new Set(nos($('#a-xs').value)), pc = new Set(nos($('#a-xp').value));
    pool = base.map(p => { let t = 1; if(p.t1!==undefined && qt.includes(String(p.t1))) t++; if(st.has(p.no)) t++; if(pc.has(p.no)) t++; return { ...p, tickets:Math.min(t,4) }; });
    const extra = pool.filter(p=>p.tickets>1);
    $('#a-pool').innerHTML = `<p>${pool.length}명 · 응모권 ${pool.reduce((s,p)=>s+p.tickets,0)}장</p>` + (extra.length ? `<table class="t">${extra.sort((a,b)=>b.tickets-a.tickets).map(p=>`<tr><td>${esc(p.no)}</td><td>${esc(p.name)}</td><td>${p.tickets}장</td></tr>`).join('')}</table>` : ''); };
  const drawOne = ex => { const c = pool.filter(p=>!ex.has(p.no)), total = c.reduce((s,p)=>s+p.tickets,0); if(!total) return null; let r = rand()*total; for(const p of c){ r -= p.tickets; if(r<0) return p; } return c[c.length-1]; };
  const show = (rank, w, note='') => { $('#a-res').innerHTML = `<div class="muted">${rank}등${note}</div><div class="big">${esc(w.name)}</div><div class="muted">${esc(w.gen)} · ${esc(w.no)}번</div>`; };
  const renderW = () => { $('#a-w').innerHTML = winners.slice().sort((a,b)=>b.rank-a.rank).map(w=>`<div class="win"><span class="rk">${w.rank}등</span><div><b>${esc(w.name)}</b> <span class="muted">${esc(w.gen)} · ${esc(w.no)}번</span></div></div>`).join(''); };
  const save = async live => { renderW(); try { await setDoc(doc(db,'draw','results'), { items:winners, live: live ? { ...live, seq: ++seq } : null }); } catch(e){ say('오프라인: 화면에만 표시됨'); } };
  $('#a-build').onclick = build;
  $('#a-draw').addEventListener('click', e => { const b = e.target.closest('button[data-r]'); if(!b) return; const rank = Number(b.dataset.r); if(!pool.length) build(); if(!pool.length){ say('응모자 없음'); return; }
    if(winners.some(w=>w.rank===rank)){ say(rank+'등은 이미 뽑았습니다'); return; } const w = drawOne(new Set(winners.map(x=>x.no))); if(!w){ say('남은 응모자 없음'); return; }
    const item = { rank, no:w.no, name:w.name, gen:w.gen, prize:PRIZES[rank] }; winners.push(item); show(rank, w); save(item); });
  $('#a-redo').onclick = () => { if(!winners.length) return; const last = winners[winners.length-1]; if(!confirm(`${last.rank}등 ${last.name} 취소하고 다시 뽑을까요?`)) return; winners.pop(); const w = drawOne(new Set(winners.map(x=>x.no))); if(!w) return; const item = { rank:last.rank, no:w.no, name:w.name, gen:w.gen, prize:PRIZES[last.rank] }; winners.push(item); show(last.rank, w, ' · 재추첨'); save(item); };
  $('#a-reset').onclick = () => { if(!confirm('결과를 모두 지울까요?')) return; winners = []; $('#a-res').innerHTML = ''; save(null); };
  render.draw = () => { if((S.draw?.live?.seq||0) > seq) seq = S.draw.live.seq; if(S.draw?.items && !winners.length){ winners = S.draw.items.slice(); renderW(); } };

  loadTables().then(render.checkins); listen.program(); listen.questions(); listen.polls(); listen.checkins(); listen.draw();
}
