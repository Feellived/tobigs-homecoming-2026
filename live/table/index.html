<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 테이블 · TOBIG'S Homecoming</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1230;--accent:#3d5afe;--peri:#9db0ff;--muted:#9aa3c7;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--field:rgba(255,255,255,.08);--display:'Space Grotesk',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--peri)}
.top{max-width:560px;margin:0 auto;padding:28px 16px 8px}
.top .slogan{display:block;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1;color:#fff;text-decoration:none}
.top .slogan b{color:var(--peri)}
.top .brand{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--peri);margin-top:8px}
main{max-width:560px;margin:0 auto;padding:8px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.eyebrow{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--peri);margin-bottom:8px}
h2{font-size:18px;margin:0 0 10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:#fff;outline:none}
input::placeholder{color:rgba(255,255,255,.4)}
input:focus,select:focus{border-color:var(--peri)}
select option{color:#0b1230}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-ghost{background:transparent;border-color:var(--line)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.num{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.num .l{font-size:12px;color:var(--muted)}
.num .v{font-family:var(--display);font-size:56px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.name{font-size:22px;font-weight:800;margin-bottom:4px}
.no{font-size:13px;color:var(--muted);margin-bottom:14px}
.foot{margin-top:16px;font-size:13px}
.back{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;margin:4px 0 0}
</style>
</head>
<body>
<header class="top"><a class="slogan" href="../">Big Then. <b>Bigger Now.</b></a><div class="brand">TOBIG'S HOMECOMING LIVE</div></header>
<main>
  <a class="back" href="../">← Live</a>
  <section class="card">
    <div class="eyebrow">MY TABLE</div>
    <div id="box"><p class="muted">불러오는 중</p></div>
  </section>
</main>
<script>
const GENS = Array.from({length:26},(_,i)=>(i+1)+'기');
const box = document.getElementById('box');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').replace(/\s+/g,'').toLowerCase();
let rows = [];
const remember = (r, on) => { try { on ? localStorage.setItem('hc_me', JSON.stringify(r)) : localStorage.removeItem('hc_me'); } catch(e){} };
const mine = () => { try { return JSON.parse(localStorage.getItem('hc_me')||'null'); } catch(e){ return null; } };
function showForm(msg){
  box.innerHTML = `<h2>내 테이블 찾기</h2><form id="f" class="row"><select id="g" required style="flex:0 0 96px"><option value="">기수</option>${GENS.map(g=>`<option>${g}</option>`).join('')}</select><input class="grow" type="text" id="n" placeholder="이름" required><button class="btn" type="submit">찾기</button></form>${msg?`<p class="muted" style="margin-top:10px">${msg}</p>`:''}`;
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const n = norm(document.getElementById('n').value), g = document.getElementById('g').value;
    const hit = rows.find(r => norm(r.name)===n && r.gen===g);
    if(!hit){ showForm('찾지 못했습니다. 이름과 기수를 확인하시거나 체크인 데스크에 문의해 주세요.'); return; }
    remember(hit, true); showMine(hit);
  });
}
function showMine(r){
  box.innerHTML = `<div class="name">${esc(r.name)} <span class="muted" style="font-size:14px;font-weight:500">${esc(r.gen)}</span></div><div class="no">명찰 번호 ${esc(r.no)}</div>
  <div class="nums"><div class="num"><div class="l">1라운드 테이블</div><div class="v">${esc(r.t1)}</div></div><div class="num"><div class="l">2라운드 테이블</div><div class="v">${esc(r.t2)}</div></div></div>
  <p class="muted" style="margin-top:12px">Table Talk 2라운드(15:25)에 두 번째 테이블로 이동합니다.</p>
  <div class="foot"><a href="#" id="other">다른 사람 찾기</a></div>`;
  document.getElementById('other').onclick = e => { e.preventDefault(); remember(null,false); showForm(); };
}
fetch('../tables.json',{cache:'no-store'}).then(r=>r.json()).then(t => {
  if(!t.published){ box.innerHTML = `<h2>내 테이블</h2><p class="muted">배정 전</p>`; return; }
  rows = t.rows || [];
  const me = mine();
  const still = me && rows.find(r => String(r.no)===String(me.no) && r.name===me.name);
  if(still) showMine(still); else showForm();
}).catch(() => { box.innerHTML = '<p class="muted">명단을 불러오지 못했습니다. 잠시 후 다시 열어주세요.</p>'; });
</script>
<script type="module">
// 강제 전환: 투표 결과 공개 · 추첨 연출이 시작되면 라이브 화면으로 이동 (라이브 화면이 전체 화면으로 띄움)
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
const db = getFirestore(initializeApp({ apiKey:"AIzaSyBKDlddQRA1mLotV2V2R-39GhwTrSQ8zVE", authDomain:"tobigshoco.firebaseapp.com", projectId:"tobigshoco", storageBucket:"tobigshoco.firebasestorage.app", messagingSenderId:"973817861716", appId:"1:973817861716:web:48c2fdd252eab5edf83fc1" }));
let showId, seq = null;
onSnapshot(collection(db,'polls'), s => { const p = s.docs.find(d => d.data().show), id = p ? p.id : null; if(showId === undefined){ showId = id; return; } if(id && id !== showId) location.href = '../?qa'; showId = id; });
onSnapshot(doc(db,'draw','results'), s => { const q = s.exists() ? (s.data().live?.seq || 0) : 0; if(seq === null){ seq = q; return; } if(q > seq) location.href = '../?draw'; seq = q; });
</script>
</body>
</html>
